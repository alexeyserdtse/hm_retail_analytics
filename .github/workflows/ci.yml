name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # dbt parse alone doesn't touch the database, but the sqlfluff dbt
      # templater opens a connection and creates the file, so point it at a
      # throwaway path rather than the (gitignored, never-present-in-CI) dev.duckdb.
      HM_DB_PATH: /tmp/ci.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install duckdb pytest dbt-duckdb sqlfluff sqlfluff-templater-dbt
      - name: Run tests
        run: python -m pytest -q
      - name: dbt parse
        run: |
          cd include/hm_dwh
          dbt deps
          dbt parse
      - name: sqlfluff
        run: sqlfluff lint include/hm_dwh
