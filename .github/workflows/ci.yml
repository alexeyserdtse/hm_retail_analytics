name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install duckdb pytest
      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "no tests yet"
          fi
